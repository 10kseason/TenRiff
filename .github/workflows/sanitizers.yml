name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  address-sanitizer:
    name: MSVC AddressSanitizer
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure ASan preset
        run: cmake --preset asan

      - name: Build unit tests
        run: cmake --build --preset asan

      - name: Run unit tests under ASan
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
        run: ctest --preset asan
