name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  address-sanitizer:
    name: MSVC AddressSanitizer
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure ASan preset
        run: cmake --preset asan

      - name: Build unit tests
        run: cmake --build --preset asan

      - name: Run unit tests under ASan
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
        run: ctest --preset asan

  nk3-cpu-smoke:
    name: NK3 OpenVINO CPU smoke
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for OpenVINO
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenVINO runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check openvino==2026.2.1
          $openvinoCmake = python -c "import pathlib, openvino; print(pathlib.Path(openvino.__file__).parent / 'cmake')"
          "TENRIFF_CI_OPENVINO_DIR=$openvinoCmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure NK3 CPU smoke
        run: cmake -S . -B build/nk3-cpu -G "Visual Studio 17 2022" -A x64 -DTENRIFF_ENABLE_TESTS=ON -DTENRIFF_ENABLE_ONNX_UPSCALER=OFF -DOpenVINO_DIR="$env:TENRIFF_CI_OPENVINO_DIR"

      - name: Build NK3 CPU smoke
        run: cmake --build build/nk3-cpu --config Release --target nk3_onnx_smoke

      - name: Run NK3 CPU smoke
        env:
          # CPU selects the OpenVINO device; pin its backend to skip AUTO's Vulkan probe.
          TENRIFF_NK3_BACKEND: OPENVINO
          TENRIFF_NK3_DEVICE: CPU
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, ProcessorId
          python -u -c "import openvino as ov; print('OpenVINO', ov.__version__); core = ov.Core(); print('Devices', core.available_devices); model = core.read_model('models/NK3-P64-hybrid.onnx'); print('Model read'); core.query_model(model, 'CPU'); print('CPU query passed'); core.compile_model(model, 'CPU'); print('CPU compile passed')"
          if ($LASTEXITCODE -ne 0) { throw "OpenVINO CPU preflight failed: $LASTEXITCODE" }
          ctest --test-dir build/nk3-cpu -C Release -R "^nk3_onnx_smoke$" --output-on-failure

      - name: Report native crash details
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction Continue |
            Where-Object { $_.Message -match 'nk3_onnx_smoke|python|openvino' } |
            Select-Object TimeCreated, Id, Message | Format-List
